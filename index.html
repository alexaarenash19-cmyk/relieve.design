<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Anti-FOUC: decide dark/light BEFORE the app bundle loads, so a
        // returning visitor with dark stored never sees a flash of the light
        // theme. Duplicates src/lib/theme.js's getPreferredTheme as plain
        // inline JS on purpose — this runs before any ES module is available,
        // so it can't import that file. Keep the two in sync if this logic
        // ever changes. Wrapped in try/catch: private-mode storage or an
        // unsupported matchMedia must never break page load.
        try {
          var stored = localStorage.getItem('relieve_theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- 2026-08-09: favicon actualizado al wordmark nuevo. SVG primero
         (navegadores modernos lo prefieren, escala mejor) — favicon.png

    <!-- Self-hosted (16 ago 2026 perf pass) -- was Google Fonts + Fontshare
         remote stylesheets/preconnects; now @font-face rules in
         src/index.css point at public/fonts/*.woff2. Preload the 2 files
         used above the fold (Courier Prime, in the Nav/Footer labels --
         see the CLS note in src/index.css) so the real font is in place
         before first paint instead of swapping in later and reflowing
         text. General Sans/Fraunces aren't preloaded -- they're not part
         of the initial above-the-fold paint the same way. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/courier-prime-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/courier-prime-700.woff2" crossorigin />
